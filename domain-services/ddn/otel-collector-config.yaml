receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlphttp:
    endpoint: http://otel-api:3000/log
    tls:
      insecure: true
    headers:
      Content-Type: application/json
  otlphttp/traces:
    endpoint: http://otel-api:3000
    tls:
      insecure: true
    # headers:
    #   Content-Type: application/json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/traces] 
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]
